<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Solar System View - a glowing sun ringed by tilted planet orbits">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#101a3a"/>
      <stop offset="55%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8"/>
      <stop offset="45%" stop-color="#ffd34d"/>
      <stop offset="100%" stop-color="#ff9b21"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd24d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="180" height="180" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="180" height="180" fill="url(#bg)"/>

    <!-- background stars -->
    <g fill="#cdd9ff">
      <circle cx="24" cy="28" r="1.1" opacity=".8"/>
      <circle cx="150" cy="22" r="1.4" opacity=".9"/>
      <circle cx="162" cy="70" r="1" opacity=".6"/>
      <circle cx="36" cy="120" r="1" opacity=".7"/>
      <circle cx="142" cy="150" r="1.3" opacity=".8"/>
      <circle cx="18" cy="86" r="1" opacity=".6"/>
      <circle cx="120" cy="40" r="0.9" opacity=".5"/>
      <circle cx="96" cy="160" r="1" opacity=".6"/>
    </g>

    <!-- tilted orbit system -->
    <g transform="rotate(-18 90 90)" fill="none">
      <ellipse cx="90" cy="90" rx="30" ry="10" stroke="#6c8fd0" stroke-opacity=".5" stroke-width="1.1"/>
      <ellipse cx="90" cy="90" rx="46" ry="15" stroke="#6c8fd0" stroke-opacity=".42" stroke-width="1.1"/>
      <ellipse cx="90" cy="90" rx="62" ry="20" stroke="#6c8fd0" stroke-opacity=".34" stroke-width="1.1"/>
      <ellipse cx="90" cy="90" rx="78" ry="26" stroke="#6c8fd0" stroke-opacity=".26" stroke-width="1.1"/>

      <!-- planets on their orbits -->
      <circle cx="64" cy="85" r="2.6" fill="#b9b2a8"/>
      <circle cx="131" cy="99" r="3.6" fill="#e8c77f"/>
      <circle cx="44" cy="98" r="4" fill="#4f93e6"/>
      <!-- Saturn with ring -->
      <g transform="translate(150 76)">
        <ellipse cx="0" cy="0" rx="11" ry="3.4" stroke="#d9c9a0" stroke-opacity=".85" stroke-width="1.6" fill="none"/>
        <circle cx="0" cy="0" r="5" fill="#e7d39a"/>
      </g>
    </g>

    <!-- sun -->
    <circle cx="90" cy="90" r="34" fill="url(#sunGlow)"/>
    <circle cx="90" cy="90" r="13" fill="url(#sun)"/>
  </g>
</svg>
